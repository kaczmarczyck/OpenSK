name: Binary size report
on:
  push:
    paths:
      - 'libraries/**/*.rs'
      - 'src/**/*.rs'
      - 'patches/**'
      - '**/Cargo.toml'
      - '.cargo/config'
      - '!third_party/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cargo_bloat:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"
      - name: Install Rust toolchain
        run: rustup show
      - uses: actions/setup-python@v1
        with:
          python-version: 3.7
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Set up OpenSK
        run: ./setup.sh

      - name: Building OpenSK
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target=thumbv7em-none-eabi --features with_ctap1,vendor_hid
        env:
          RUSTFLAGS: "-C link-arg=-icf=all -C force-frame-pointers=no"

      - name: Run cargo bloat
        uses: orf/cargo-bloat-action@v1
        with:
          bloat_args: "--release --target=thumbv7em-none-eabi --features=with_ctap1,vendor_hid"
